title: Dev As Pros
email: devaspros@gmail.com
description: >-
  Desarrollo de Software para Pequeñas y Medianas Empresas
baseurl: "" # the subpath of your site, e.g. /blog
url: "https://www.devaspros.com" # the base hostname & protocol for your site, e.g. http://example.com
twitter_username: devaspros
github_username:  devaspros

# Build settings
markdown: kramdown
theme: minima
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
sass:
  sass_dir: _sass
  style: compressed

# Exclude from processing.
# OJO: en Jekyll 3 (esta version, fijada por github-pages 232) esta lista
# REEMPLAZA la de por defecto, no se suma a ella. Por eso hay que repetir
# las entradas por defecto aqui. En Jekyll 4 el comportamiento es al reves.
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - CLAUDE.md
  - README.md
  # Documentos internos. Van en .gitignore, pero Jekyll 3 no lo lee y los
  # construiria igual, asi que tambien hay que excluirlos aqui.
  - plans/

# SEO PLUGIN
twitter:
  username: devaspros
  card: summary
lang: es
# OJO: no reponer `logo:` aqui. En jekyll-seo-tag esa clave solo alimenta el bloque
# `publisher` del JSON-LD, y ese bloque le pone como `name` el nombre del AUTOR de la
# pagina (json_ld_drop.rb: output["name"] = page_drop.author.name). Con el `author`
# de los posts configurado, eso declaraba una Organization llamada "Francisco
# Quintero", que es una entidad falsa. Sin la clave, seo-tag no emite el publisher.
# El logo se declara donde corresponde: el nodo ProfessionalService de
# _includes/schema_organizacion.html.
social:
  name: Dev As Pros
  links:
    - https://twitter.com/devaspros
    - https://www.instagram.com/devaspros/
    - https://www.linkedin.com/company/devaspros/
    - https://github.com/devaspros/

collections:
  projects:
    output: true

permalink: pretty

# Autor por defecto de los posts. Acotado a `type: posts` a proposito: puesto en
# `author:` global se lo aplicaria tambien a las paginas de servicio, donde el
# autor es la empresa y no una persona.
# La url es la misma que la del nodo Person del grafo (ver
# _includes/schema_organizacion.html): mismo nombre y misma url es lo que permite
# reconciliar el `author` que emite jekyll-seo-tag con ese nodo.
# Si un post futuro es de otra persona, se sobreescribe en su front matter.
defaults:
  - scope:
      path: ""
      type: posts
    values:
      author:
        name: Francisco Quintero
        url: "https://www.devaspros.com/nosotros/"
