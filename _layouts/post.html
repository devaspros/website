---
layout: default
---

<section class="post-hero">
  <div class="container text-center">
    <h1 class="text-shadow">{{ page.title }}</h1>
    <p class="post-date">{{ page.date | date: "%d de %B de %Y" }}</p>
  </div>
</section>

<article class="blog-post">
  <div class="container">
    <div class="post-content">
      {{ content }}
    </div>

    {% if page.original_url %}
      <div class="post-footer">
        <p class="canonical-note">
          Este artículo fue publicado originalmente en
          <a href="{{ page.original_url }}" target="_blank" rel="noreferrer noopener">El Camino del Pro</a>.
        </p>
      </div>
    {% endif %}
  </div>
</article>
